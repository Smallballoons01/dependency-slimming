name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Unit tests and documentation contracts
        run: node --test
      - name: The planner runs against this repository
        run: node scripts/plan.mjs . --json > /dev/null
      - name: The installer stays a dry run by default
        run: node scripts/install.mjs
